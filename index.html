<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Reflection Exercise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="content" class="content"></div>

  <div class="controls">
    <button id="prevBtn" type="button">Previous</button>
    <div id="videoCounter" class="video-counter">Video 1 of 1</div>
    <button id="nextBtn" type="button">Next</button>
  </div>

  <!-- ✅ Video search bar -->
  <div class="search-control">
    <input type="number" id="videoSearch" placeholder="Enter video number..." min="1" />
    <button id="goBtn" type="button">Go</button>
  </div>

  <div class="add-question">
    <input type="text" id="newQuestion" placeholder="Add a new question..." />
    <button id="addQuestionBtn" type="button">Add Question</button>
  </div>

  <script src="script.js"></script>

  <footer>
    Created by: Eltayeb Ali Abdalla Mohamed
  </footer>
</body>
</html>
